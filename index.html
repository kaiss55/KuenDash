<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老友記巴士站 - 手機專用版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-size: 18px; background-color: #f0f4f8; color: #111; }
        .btn-large { min-height: 70px; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 頂部標題列 -->
    <header class="bg-blue-600 text-white p-4 text-center shadow-md">
        <h1 class="text-3xl font-black">🚌 老友記巴士站</h1>
        <p class="text-sm mt-1">手機專用 · 一撳即轉模式</p>
    </header>

    <!-- 頂部超大分頁切換掣 -->
    <div class="grid grid-cols-2 bg-blue-800 text-white p-2 gap-2 shadow-md">
        <button onclick="switchTab(1)" id="tabBtn1" class="py-3 px-2 rounded-xl text-center font-black text-base bg-yellow-400 text-blue-900 shadow">
            📑 1. 查指定路線
        </button>
        <button onclick="switchTab(2)" id="tabBtn2" class="py-3 px-2 rounded-xl text-center font-black text-base bg-blue-900 text-white shadow">
            📍 2. 附近最近 3 站
        </button>
    </div>

    <!-- 主體內容區 -->
    <main class="container mx-auto p-4 max-w-md flex-grow">
        
        <!-- 📄 畫面 1：指定路線查詢 & 路線內定位 -->
        <div id="section1" class="space-y-4">
            <div class="bg-white rounded-2xl p-4 shadow">
                <h2 class="text-xl font-bold mb-3 text-gray-700">⭐ 選擇常用巴士線</h2>
                <div class="grid grid-cols-3 gap-3 mb-3">
                    <button onclick="handleRouteSelect('1A')" class="btn-large bg-blue-500 text-white rounded-xl shadow">1A</button>
                    <button onclick="handleRouteSelect('6')" class="btn-large bg-blue-500 text-white rounded-xl shadow">6</button>
                    <button onclick="handleRouteSelect('27')" class="btn-large bg-blue-500 text-white rounded-xl shadow">27</button>
                    <button onclick="handleRouteSelect('213X')" class="btn-large bg-blue-500 text-white rounded-xl shadow">213X</button>
                    <button onclick="handleRouteSelect('14')" class="btn-large bg-blue-500 text-white rounded-xl shadow">14</button>
                    <button onclick="handleRouteSelect('6D')" class="btn-large bg-blue-500 text-white rounded-xl shadow">6D</button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="customRouteInput" placeholder="例如: 27" class="border-2 border-gray-300 rounded-xl p-3 text-xl w-full uppercase text-center font-bold">
                    <button onclick="searchCustomRoute()" class="bg-green-600 text-white px-5 rounded-xl text-lg font-bold shadow">查詢</button>
                </div>
            </div>

            <!-- 路線結果區 -->
            <div id="resultBox" class="bg-white rounded-2xl p-4 shadow hidden">
                <div class="flex justify-between items-center mb-3">
                    <h2 id="boxTitle" class="text-xl font-black text-blue-800">路線資訊</h2>
                    <button onclick="clearResult()" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-lg font-bold">關閉</button>
                </div>
                <div id="directionSelector" class="grid grid-cols-2 gap-2 mb-3"></div>
                <div id="nearbyRouteBtnContainer" class="mb-3"></div>
                <div id="boxContent" class="space-y-3 max-h-[400px] overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- 📍 畫面 2：附近最近 3 個站總覽 -->
        <div id="section2" class="space-y-4 hidden">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-4 shadow-lg text-white text-center">
                <h2 class="text-2xl font-black mb-2">📍 附近最近車站總覽</h2>
                <p class="text-sm mb-4">按呢個掣，自動搵出附近最近 3 個站，並顯示全部經過嘅巴士！</p>
                <button onclick="findAllNearbyStops()" class="w-full bg-white text-emerald-800 py-4 rounded-xl text-xl font-black shadow active:bg-gray-100">
                    🔍 尋找附近最近 3 個站
                </button>
            </div>

            <div id="nearbyAllBox" class="space-y-4">
                <div class="bg-white rounded-2xl p-5 shadow text-center text-gray-500 font-bold">
                    請點擊上方按鈕開始定位
                </div>
            </div>
        </div>

    </main>

    <!-- 底部版權 -->
    <footer class="bg-gray-200 text-center py-3 text-sm text-gray-600">
        香港九巴開放數據實時支援
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        function switchTab(tabIndex) {
            const sec1 = document.getElementById('section1');
            const sec2 = document.getElementById('section2');
            const btn1 = document.getElementById('tabBtn1');
            const btn2 = document.getElementById('tabBtn2');

            if (tabIndex === 1) {
                sec1.classList.remove('hidden');
                sec2.classList.add('hidden');
                btn1.className = "py-3 px-2 rounded-xl text-center font-black text-base bg-yellow-400 text-blue-900 shadow";
                btn2.className = "py-3 px-2 rounded-xl text-center font-black text-base bg-blue-900 text-white shadow";
            } else {
                sec1.classList.add('hidden');
                sec2.classList.remove('hidden');
                btn2.className = "py-3 px-2 rounded-xl text-center font-black text-base bg-yellow-400 text-blue-900 shadow";
                btn1.className = "py-3 px-2 rounded-xl text-center font-black text-base bg-blue-900 text-white shadow";
            }
        }

        let currentRoute = '';
        let currentDirection = 'outbound';
        let cachedRouteStops = [];

        function clearResult() {
            document.getElementById('resultBox').classList.add('hidden');
        }

        function handleRouteSelect(routeStr) {
            const clean = routeStr.trim().toUpperCase();
            document.getElementById('customRouteInput').value = clean;
            setupRouteView(clean);
        }

        function searchCustomRoute() {
            const val = document.getElementById('customRouteInput').value.trim().toUpperCase();
            if(!val) { alert('請先輸入線號！'); return; }
            setupRouteView(val);
        }

        function setupRouteView(route) {
            currentRoute = route;
            const box = document.getElementById('resultBox');
            const title = document.getElementById('boxTitle');
            const dirSelector = document.getElementById('directionSelector');
            const nearbyBtnContainer = document.getElementById('nearbyRouteBtnContainer');

            box.classList.remove('hidden');
            title.innerText = `${route} 號線`;
            
            dirSelector.innerHTML = `
                <button onclick="switchDirection('${route}', 'outbound')" id="btn-outbound" class="bg-blue-600 text-white p-3 rounded-xl font-bold text-base shadow text-center">
                    👉 去程
                </button>
                <button onclick="switchDirection('${route}', 'inbound')" id="btn-inbound" class="bg-gray-300 text-gray-800 p-3 rounded-xl font-bold text-base shadow text-center">
                    👈 回程
                </button>
            `;

            nearbyBtnContainer.innerHTML = `
                <button onclick="findNearestStopsForCurrentRoute()" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-black text-base shadow-md flex items-center justify-center gap-2">
                    📍 搵我附近嘅 ${route} 號線最近 3 個站
                </button>
            `;

            switchDirection(route, 'outbound');
        }

        function switchDirection(route, directionStr) {
            currentDirection = directionStr;
            const btnOut = document.getElementById('btn-outbound');
            const btnIn = document.getElementById('btn-inbound');
            if(directionStr === 'outbound') {
                btnOut.className = "bg-blue-600 text-white p-3 rounded-xl font-bold text-base shadow text-center";
                btnIn.className = "bg-gray-300 text-gray-800 p-3 rounded-xl font-bold text-base shadow text-center";
            } else {
                btnOut.className = "bg-gray-300 text-gray-800 p-3 rounded-xl font-bold text-base shadow text-center";
                btnIn.className = "bg-emerald-600 text-white p-3 rounded-xl font-bold text-base shadow text-center";
            }
            loadAllStops(route, directionStr);
        }

        async function loadAllStops(route, directionStr) {
            const content = document.getElementById('boxContent');
            content.innerHTML = `<p class="text-blue-600 text-center py-4 font-bold">⏳ 正在讀取全線車站...</p>`;

            try {
                const url = `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${directionStr}/1`;
                const res = await fetch(url);
                const json = await res.json();

                if (!json.data || json.data.length === 0) throw new Error('暫無站點');

                cachedRouteStops = json.data;
                content.innerHTML = `<p class="text-green-600 font-bold mb-2">✅ 共 ${cachedRouteStops.length} 個車站：</p>`;

                for (let i = 0; i < cachedRouteStops.length; i++) {
                    const stopId = cachedRouteStops[i].stop;
                    const stopNum = i + 1;
                    const cardId = `stop-card-${route}-${directionStr}-${stopId}-${i}`;

                    content.innerHTML += `
                        <div id="${cardId}" class="bg-blue-50 p-3 rounded-xl border border-blue-200 shadow-sm">
                            <div class="text-xs text-gray-500 font-bold">站點 ${stopNum}</div>
                            <div class="text-lg font-bold text-gray-800">載入中...</div>
                            <div class="text-sm text-gray-400">⏱️ 計算中...</div>
                        </div>
                    `;
                    fetchStopDetails(stopId, route, cardId);
                }
            } catch (err) {
                content.innerHTML = `<p class="text-red-600 font-bold text-center py-4">❌ 讀取失敗。</p>`;
            }
        }

        async function findNearestStopsForCurrentRoute() {
            const content = document.getElementById('boxContent');
            content.innerHTML = `<p class="text-blue-600 text-center py-6 font-bold">🛰️ 正在定位並計算距離...</p>`;

            if (!navigator.geolocation) {
                content.innerHTML = `<p class="text-red-600 font-bold text-center">❌ 不支援定位功能。</p>`;
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;

                try {
                    let stopsWithCoords = [];
                    for (let item of cachedRouteStops) {
                        const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`);
                        const stopJson = await stopRes.json();
                        if (stopJson && stopJson.data) {
                            const stop = stopJson.data;
                            const dist = getDistanceFromLatLonInKm(userLat, userLon, parseFloat(stop.lat), parseFloat(stop.long));
                            stopsWithCoords.push({ stopId: item.stop, name: stop.name_tc, distance: dist });
                        }
                    }

                    stopsWithCoords.sort((a, b) => a.distance - b.distance);
                    const nearestThree = stopsWithCoords.slice(0, 3);

                    content.innerHTML = `<p class="text-emerald-700 font-bold mb-2">🎯 ${currentRoute} 號線最近 3 個站：</p>`;

                    for (let i = 0; i < nearestThree.length; i++) {
                        const s = nearestThree[i];
                        const distanceMeters = Math.round(s.distance * 1000);
                        const cardId = `nearest-route-card-${s.stopId}-${i}`;

                        content.innerHTML += `
                            <div id="${cardId}" class="bg-emerald-50 p-4 rounded-xl border-2 border-emerald-300 shadow-sm mb-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold text-emerald-800 bg-emerald-200 px-2 py-0.5 rounded">最近第 ${i+1} 站</span>
                                    <span class="text-sm font-bold text-gray-600">約距 ${distanceMeters} 米</span>
                                </div>
                                <div class="text-xl font-black text-gray-900 my-1">${s.name}</div>
                                <div class="text-lg font-bold text-red-600 bg-white p-2 rounded-lg text-center border border-red-100">
                                    ⏱️ 讀取中...
                                </div>
                            </div>
                        `;
                        fetchStopEtasForRoute(s.stopId, currentRoute, cardId);
                    }
                } catch (err) {
                    content.innerHTML = `<p class="text-red-600 font-bold text-center py-4">❌ 計算距離失敗。</p>`;
                }
            }, () => { alert('請允許定位權限'); }, { timeout: 10000 });
        }


        // --- 畫面 2 邏輯 (已加入防重覆與合併處理) ---
        async function findAllNearbyStops() {
            const box = document.getElementById('nearbyAllBox');
            box.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow text-center text-blue-600 font-bold text-lg">🛰️ 正在獲取您的 GPS 位置並掃描附近車站...</div>`;

            if (!navigator.geolocation) {
                box.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow text-center text-red-600 font-bold">❌ 瀏覽器不支援定位</div>`;
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;

                try {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop`);
                    const json = await res.json();
                    if (!json.data) throw new Error('無法取得站點');

                    const stopsWithDist = json.data.map(stop => {
                        const dist = getDistanceFromLatLonInKm(userLat, userLon, parseFloat(stop.lat), parseFloat(stop.long));
                        return { ...stop, distance: dist };
                    });

                    stopsWithDist.sort((a, b) => a.distance - b.distance);
                    const nearest3 = stopsWithDist.slice(0, 3);

                    box.innerHTML = '';

                    for (let i = 0; i < nearest3.length; i++) {
                        const stop = nearest3[i];
                        const distMeters = Math.round(stop.distance * 1000);
                        const cardId = `all-nearby-stop-${stop.stop}-${i}`;

                        box.innerHTML += `
                            <div id="${cardId}" class="bg-white rounded-2xl p-4 shadow-md border-2 border-emerald-200">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">附近第 ${i+1} 站</span>
                                    <span class="text-sm font-bold text-gray-500">約距 ${distMeters} 米</span>
                                </div>
                                <h3 class="text-xl font-black text-gray-900 mb-2">${stop.name_tc}</h3>
                                <div class="space-y-2 border-t pt-2 text-sm" id="eta-list-${cardId}">
                                    <p class="text-gray-400">正在讀取經過此站的巴士與到站時間...</p>
                                </div>
                            </div>
                        `;

                        fetchDetailedStopEtas(stop.stop, `eta-list-${cardId}`);
                    }

                } catch (err) {
                    box.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow text-center text-red-600 font-bold">❌ 讀取附近站點失敗</div>`;
                }
            }, () => { alert('請確認已開啟定位權限'); }, { timeout: 10000 });
        }

        async function fetchDetailedStopEtas(stopId, containerId) {
            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const json = await res.json();
                const container = document.getElementById(containerId);

                if (!json.data || json.data.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 font-bold">暫時沒有實時到站資料</p>`;
                    return;
                }

                // 🌟 防重覆與合併處理 (Dedup & Group by Route)
                let routeMap = {};
                
                json.data.forEach(e => {
                    const route = e.route;
                    const dest = e.dest_tc || '指定方向';
                    // 用 Route + Dest 做 Key，確保同一條線唔同方向分開，但同方向嘅多個班次合併
                    const key = `${route}-${dest}`; 

                    let timeStr = '到達中';
                    let timeVal = 999; // 用於排序
                    if (e.eta) {
                        const diff = Math.round((new Date(e.eta) - new Date()) / 60000);
                        timeVal = diff;
                        timeStr = diff <= 0 ? '即將到站' : `${diff}分鐘`;
                    }

                    if (!routeMap[key]) {
                        routeMap[key] = { route, dest, times: [] };
                    }
                    routeMap[key].times.push({ timeStr, timeVal });
                });

                container.innerHTML = '';
                
                // 轉返做 Array 並按最快到站時間排序
                let uniqueRoutes = Object.values(routeMap);
                
                // 限制最多顯示 5 條唔同嘅路線
                uniqueRoutes.slice(0, 5).forEach(item => {
                    // 取頭兩班車嘅時間串埋一齊 (例如: "3分鐘 ｜ 12分鐘")
                    item.times.sort((a, b) => a.timeVal - b.timeVal);
                    const combinedTimes = item.times.slice(0, 2).map(t => t.timeStr).join(' ｜ ');

                    container.innerHTML += `
                        <div class="bg-gray-50 p-2.5 rounded-xl flex justify-between items-center border border-gray-100">
                            <div>
                                <span class="bg-blue-600 text-white font-black px-2.5 py-1 rounded text-base">${item.route}</span>
                                <span class="text-gray-700 font-bold ml-2">往 ${item.dest}</span>
                            </div>
                            <span class="text-red-600 font-black text-lg">${combinedTimes}</span>
                        </div>
                    `;
                });

            } catch (e) {
                document.getElementById(containerId).innerHTML = `<p class="text-red-500">無法讀取 ETA</p>`;
            }
        }

        // --- 共用函數 ---
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }

        async function fetchStopEtas
