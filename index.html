<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老友記巴士站 - 來回方向切換版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-size: 18px; background-color: #f0f4f8; color: #111; }
        .btn-large { min-height: 70px; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 頂部標題列 -->
    <header class="bg-blue-600 text-white p-4 text-center shadow-md">
        <h1 class="text-3xl font-black">🚌 老友記巴士站</h1>
        <p class="text-sm mt-1">簡潔大字版 · 隨時切換去回程</p>
    </header>

    <!-- 主體內容區 -->
    <main class="container mx-auto p-4 max-w-md flex-grow">

        <!-- 常用線路快捷按鈕 -->
        <div class="bg-white rounded-2xl p-4 shadow mb-6">
            <h2 class="text-xl font-bold mb-3 text-gray-700">⭐ 常用巴士線</h2>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="handleRouteSelect('1A')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">1A</button>
                <button onclick="handleRouteSelect('6')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">6</button>
                <button onclick="handleRouteSelect('27')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">27</button>
                <button onclick="handleRouteSelect('213X')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">213X</button>
                <button onclick="handleRouteSelect('14')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">14</button>
                <button onclick="handleRouteSelect('6D')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">6D</button>
            </div>
        </div>

        <!-- 自訂輸入路線 -->
        <div class="bg-white rounded-2xl p-4 shadow mb-6">
            <h2 class="text-xl font-bold mb-2 text-gray-700">🔎 輸入其他路線</h2>
            <div class="flex gap-2">
                <input type="text" id="customRouteInput" placeholder="例如: 213X" class="border-2 border-gray-300 rounded-xl p-3 text-2xl w-full uppercase text-center font-bold">
                <button onclick="searchCustomRoute()" class="bg-green-600 text-white px-6 rounded-xl text-xl font-bold shadow">查詢</button>
            </div>
        </div>

        <!-- 結果顯示區 -->
        <div id="resultBox" class="bg-white rounded-2xl p-5 shadow hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 id="boxTitle" class="text-xl font-black text-blue-800">路線資訊</h2>
                <button onclick="clearResult()" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-lg font-bold">關閉</button>
            </div>

            <!-- 🚏 Inbound / Outbound 方向切換按鈕區 -->
            <div id="directionSelector" class="grid grid-cols-2 gap-2 mb-4">
                <!-- 動態生成的去程/回程大掣 -->
            </div>

            <!-- 全線站點與 ETA 列表 -->
            <div id="boxContent" class="space-y-3 max-h-[500px] overflow-y-auto pr-1
