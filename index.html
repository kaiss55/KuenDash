<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老人家老友記巴士板</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-size: 18px;
            background-color: #f0f4f8;
            color: #111;
        }
        .btn-large {
            min-height: 70px;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 頂部標題列 -->
    <header class="bg-blue-600 text-white p-4 text-center shadow-md">
        <h1 class="text-3xl font-black">🚌 老友記巴士站</h1>
        <p class="text-sm mt-1">簡潔大字版 · 專為九龍區而設</p>
    </header>

    <!-- 主體內容區 -->
    <main class="container mx-auto p-4 max-w-md flex-grow">

        <!-- 常用線路快捷按鈕 (九龍熱門線路) -->
        <div class="bg-white rounded-2xl p-4 shadow mb-6">
            <h2 class="text-xl font-bold mb-3 text-gray-700">⭐ 常用巴士線</h2>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="selectRoute('1A')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">1A</button>
                <button onclick="selectRoute('6')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">6</button>
                <button onclick="selectRoute('213X')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">213X</button>
                <button onclick="selectRoute('14')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">14</button>
                <button onclick="selectRoute('6D')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">6D</button>
                <button onclick="selectRoute('27')" class="btn-large bg-blue-500 text-white rounded-xl shadow active:bg-blue-700">27</button>
            </div>
        </div>

        <!-- 自訂輸入路線 -->
        <div class="bg-white rounded-2xl p-4 shadow mb-6">
            <h2 class="text-xl font-bold mb-2 text-gray-700">🔎 輸入其他路線</h2>
            <div class="flex gap-2">
                <input type="text" id="customRouteInput" placeholder="例如: 13X" class="border-2 border-gray-300 rounded-xl p-3 text-2xl w-full uppercase text-center font-bold">
                <button onclick="searchCustomRoute()" class="bg-green-600 text-white px-6 rounded-xl text-xl font-bold shadow">查詢</button>
            </div>
        </div>

        <!-- 到站與方向結果顯示區 -->
        <div id="resultContainer" class="bg-white rounded-2xl p-5 shadow hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 id="resultTitle" class="text-xl font-black text-blue-800">路線資訊</h2>
                <button onclick="clearResult()" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-lg font-bold">關閉</button>
            </div>

            <!-- 方向選擇按鈕區 (會動態生成去程/回程大掣) -->
            <div id="directionSelector" class="mb-4 space-y-2">
                <!-- 這裡會由 JS 塞入方向按鈕 -->
            </div>

            <div id="etaList" class="space-y-4">
                <p class="text-center text-gray-500">請先選擇方向...</p>
            </div>
        </div>

    </main>

    <!-- 底部版權 -->
    <footer class="bg-gray-200 text-center py-3 text-sm text-gray-600">
        香港開放數據 (Data.gov.hk) 實時支援
    </footer>

    <!-- JavaScript 邏輯：支援來回線選擇 -->
    <script>
        let currentRouteGlobal = '';
        let routeDirections = [];

        function selectRoute(routeStr) {
            document.getElementById('customRouteInput').value = routeStr;
            fetchRouteDirections(routeStr);
        }

        function searchCustomRoute() {
            const val = document.getElementById('customRouteInput').value.trim().toUpperCase();
            if(!val) {
                alert('請先輸入巴士線號！');
                return;
            }
            fetchRouteDirections(val);
        }

        function clearResult() {
            document.getElementById('resultContainer').classList.add('hidden');
        }

        // 1. 先取得該線路所有可用嘅方向 (通常有 2 個方向：O=Outbound, I=Inbound)
        async function fetchRouteDirections(route) {
            currentRouteGlobal = route;
            const container = document.getElementById('resultContainer');
            const dirEl = document.getElementById('directionSelector');
            const listEl = document.getElementById('etaList');
            const titleEl = document.getElementById('resultTitle');

            container.classList.remove('hidden');
            titleEl.innerText = `${route} 號線`;
            dirEl.innerHTML = `<p class="text-center text-blue-600">正在讀取來回方向...</p>`;
            listEl.innerHTML = '';

            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}`);
                const data = await res.json();

                if (!data || !data.data || data.data.length === 0) {
                    throw new Error('找不到此路線');
                }

                routeDirections = data.data; // 通常包含方向 1 同方向 2
                dirEl.innerHTML = `<p class="text-sm font-bold text-gray-600 mb-1">請選擇搭邊個方向：</p>`;
                
                // 動態生成大按鈕畀老人家揀去邊
                routeDirections.forEach((dirInfo, index) => {
                    const dest = dirInfo.dest_tc;
                    const orig = dirInfo.orig_tc;
                    const bound = dirInfo.bound;
                    const serviceType = dirInfo.service_type || '1';

                    const btn = document.createElement('button');
                    btn.className = "w-full bg-blue-50 hover:bg-blue-100 border-2 border-blue-400 text-blue-900 p-3 rounded-xl font-bold text-lg text-left shadow flex justify-between items-center mb-2";
                    btn.innerHTML = `<span>📍 往：${dest}</span> <span class="text-sm bg-blue-600 text-white px-2 py-1 rounded">選擇呢邊</span>`;
                    
                    btn.onclick = () => fetchStopsForDirection(route, bound, serviceType, orig, dest);
                    dirEl.appendChild(btn);
                });

            } catch (error) {
                console.error(error);
                dirEl.innerHTML = `<p class="text-red-500 font-bold">查詢失敗，請檢查線號（確保為正確九巴編號）。</p>`;
            }
        }

        // 2. 當老人家揀咗某個方向後，撈出該方向嘅站點同到站時間
        async function fetchStopsForDirection(route, bound, serviceType, orig, dest) {
            const listEl = document.getElementById('etaList');
            const titleEl = document.getElementById('resultTitle');

            titleEl.innerText = `${route} (往 ${dest})`;
            listEl.innerHTML = `<p class="text-center text-xl text-blue-600 py-4">正在載入「${dest}」方向嘅車站...</p>`;

            try {
                // 取得該方向嘅站點編號清單
                const stopsRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${bound}/${serviceType}`);
                const stopsJson = await stopsRes.json();

                if (!stopsJson.data || stopsJson.data.length === 0) {
                    throw new Error('找不到站點');
                }

                const stops = stopsJson.data;
                listEl.innerHTML = '';

                // 為了照顧老人家，先顯示頭 6 個主要站點
                let count = 0;
                for (let item of stops) {
                    if (count >= 6) break; 
                    count++;

                    const stopId = item.stop;
                    
                    // 拎站名
                    const stopInfoRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`);
                    const stopInfo = await stopInfoRes.json();
                    const stopName = stopInfo.data ? stopInfo.data.name_tc : '未知站名';

                    // 拎該站嘅 ETA
                    const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                    const etaData = await etaRes.json();
                    
                    let timeStr = '暫無班次資料';
                    if (etaData && etaData.data) {
                        const routeEtas = etaData.data.filter(e => e.route.toUpperCase() === route.toUpperCase() && e.dir === bound);
                        if (routeEtas.length > 0) {
                            let times = routeEtas.map(e => {
                                if (!e.eta) return '到達中';
                                const diffMin = Math.round((new Date(e.eta) - new Date()) / 60000);
                                return diffMin <= 0 ? '即將到站' : `${diffMin}分鐘`;
                            });
                            timeStr = times.slice(0, 2).join(' ｜ ');
                        }
                    }

                    // 組合大字卡片
                    const card = `
                        <div class="bg-blue-50 border-2 border-blue-200 rounded-xl p-4 shadow-sm">
                            <div class="text-sm font-bold text-gray-500">站點 ${count}</div>
                            <div class="text-xl font-bold text-gray-800 mb-2">${stopName}</div>
                            <div class="text-2xl font-black text-red-600 bg-white p-3 rounded-lg text-center border border-red-100">
                                ⏱️ ${timeStr}
                            </div>
                        </div>
                    `;
                    listEl.innerHTML += card;
                }

            } catch (error) {
                console.error(error);
                listEl.innerHTML = `<p class="text-center text-red-500 text-xl py-4">載入站點失敗，請稍後重試。</p>`;
            }
        }
    </script>
</body>
</html>
