<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>JSON 結構偵測版</title>
</head>
<body style="font-size: 20px; padding: 20px;">
    <h1>🧪 27 號 API 結構偵測</h1>
    
    <button onclick="test27()" style="padding: 20px; font-size: 22px; background: lightgreen;">
        點擊測試 27 號 API
    </button>

    <pre id="log" style="margin-top: 20px; background: #eee; padding: 15px; font-size: 16px; white-space: pre-wrap;"></pre>

    <script>
        async function test27() {
            const logDiv = document.getElementById('log');
            logDiv.innerText = "正在連線 27 號 API...\n";
            
            try {
                const url = "https://data.etabus.gov.hk/v1/transport/kmb/route/27";
                const res = await fetch(url);
                const json = await res.json();
                
                // 直接將整個 JSON 印出嚟，睇下裏面究竟有咩結構
                logDiv.innerText += "API 完整回傳內容：\n" + JSON.stringify(json, null, 2);
                
            } catch (err) {
                logDiv.innerText += "\n[錯誤]: " + err.message;
            }
        }
    </script>
</body>
</html>
