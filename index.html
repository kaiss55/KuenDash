<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>極簡測試版</title>
</head>
<body style="font-size: 24px; padding: 20px;">
    <h1>🧪 極簡測試按鈕</h1>
    
    <!-- 直接寫死行 Javascript，睇吓出唔出到 alert -->
    <button onclick="alert('撳咗 27 掣！'); test27();" style="padding: 20px; font-size: 24px; background: yellow;">
        按呢度測試 27
    </button>

    <div id="log" style="margin-top: 20px; color: blue;"></div>

    <script>
        async function test27() {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = "正在連線 27 號 API...";
            
            try {
                const url = "https://data.etabus.gov.hk/v1/transport/kmb/route/27";
                logDiv.innerHTML += "<br>URL: " + url;
                
                const res = await fetch(url);
                const data = await res.json();
                
                logDiv.innerHTML += `<br><span style="color: green;">成功！回傳咗 ${data.data.length} 個方向。</span>`;
            } catch (err) {
                logDiv.innerHTML += `<br><span style="color: red;">失敗: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
