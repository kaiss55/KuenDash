<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長者專用九巴簡易看板</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f7f9fa;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            color: #d9383a;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            font-size: 26px;
            padding: 12px;
            border: 3px solid #ccc;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
        button {
            font-size: 24px;
            padding: 12px 24px;
            background-color: #2b8a3e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #237032;
        }
        .loading {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #666;
            display: none;
        }
        .direction-section {
            background: white;
            border: 4px solid #2b8a3e;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .direction-title {
            background-color: #2b8a3e;
            color: white;
            padding: 15px;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
        }
        .stop-list {
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .stop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 15px;
            border-bottom: 2px solid #eee;
        }
        .stop-item:last-child {
            border-bottom: none;
        }
        .stop-name {
            font-size: 24px;
            font-weight: bold;
            max-width: 65%;
        }
        .eta-container {
            text-align: right;
        }
        .eta-box {
            font-size: 26px;
            font-weight: bold;
            color: #d9383a;
            display: block;
        }
        .eta-next {
            font-size: 18px;
            color: #666;
            display: block;
            margin-top: 4px;
        }
        .no-bus {
            font-size: 22px;
            color: #999;
        }
    </style>
</head>
<body>

    <h1>🚌 長者簡易巴士到站時間</h1>

    <!-- 輸入車號欄位 -->
    <div class="search-box">
        <input type="text" id="routeInput" placeholder="請輸入巴士號碼 (例如 30)" inputmode="search">
        <button onclick="searchBus()">查詢</button>
    </div>

    <div id="loadingStatus" class="loading">正在查詢，請稍候...</div>

    <!-- 結果顯示區域 -->
    <div id="resultArea"></div>

    <script>
        // 全局暫存，用來儲存巴士站 ID 對應的中文名稱
        let stopNameMap = {};

        // 主程式：查詢巴士
        async function searchBus() {
            const route = document.getElementById('routeInput').value.trim().toUpperCase();
            if (!route) {
                alert('請先輸入巴士號碼！');
                return;
            }

            const loading = document.getElementById('loadingStatus');
            const resultArea = document.getElementById('resultArea');
            
            loading.style.display = 'block';
            resultArea.innerHTML = '';

            try {
                // 1. 同時獲取去程與回程的車站線路靜態資料 (Service Type 預設為 1)
                const [outboundRes, inboundRes] = await Promise.all([
                    fetch(`https://etabus.gov.hk{route}/outbound/1`).then(res => res.json()),
                    fetch(`https://etabus.gov.hk{route}/inbound/1`).then(res => res.json())
                ]);

                if ((!outboundRes.data || outboundRes.data.length === 0) && (!inboundRes.data || inboundRes.data.length === 0)) {
                    loading.style.display = 'none';
                    resultArea.innerHTML = `<div style="text-align:center; font-size:24px; color:red; font-weight:bold;">找不到這條巴士線 (${route})，請檢查輸入是否正確。</div>`;
                    return;
                }

                // 2. 獲取整條線所有車站的實時 ETA 數據
                const etaRes = await fetch(`https://etabus.gov.hk{route}/1`).then(res => res.json());
                const etaData = etaRes.data || [];

                // 3. 處理並分開去程 (O) 與回程 (I) 的車站與時間
                let htmlContent = '';
                
                if (outboundRes.data && outboundRes.data.length > 0) {
                    htmlContent += await buildDirectionDOM(route, "去程", outboundRes.data, etaData.filter(e => e.dir === 'O'));
                }
                if (inboundRes.data && inboundRes.data.length > 0) {
                    htmlContent += await buildDirectionDOM(route, "回程", inboundRes.data, etaData.filter(e => e.dir === 'I'));
                }

                resultArea.innerHTML = htmlContent;

            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<div style="text-align:center; font-size:22px; color:red;">網絡錯誤或 API 故障，請重試。</div>`;
            } finally {
                loading.style.display = 'none';
            }
        }

        // 獲取單個巴士站的名稱（帶有本地暫存機制，避免重複查同一個站）
        async function getStopName(stopId) {
            if (stopNameMap[stopId]) {
                return stopNameMap[stopId];
            }
            try {
                const res = await fetch(`https://etabus.gov.hk{stopId}`).then(res => res.json());
                if (res.data && res.data.name_tc) {
                    stopNameMap[stopId] = res.data.name_tc;
                    return res.data.name_tc;
                }
            } catch (e) {
                console.error(e);
            }
            return "未知巴士站";
        }

        // 計算實時剩餘時間（分鐘）
        function calculateRemainingMinutes(etaString) {
            if (!etaString) return null;
            const now = new Date();
            const etaTime = new Date(etaString);
            const diffMs = etaTime - now;
            const diffMins = Math.ceil(diffMs / 1000 / 60);
            return diffMins <= 0 ? "即將到站" : `${diffMins} 分鐘`;
        }

        // 建立單一方向的 HTML 介面
        async function buildDirectionDOM(routeNum, dirLabel, routeStops, etaList) {
            // 找出該方向的目的地名稱
            let destName = dirLabel === "去程" ? "指定目的地" : "起點站";
            if (etaList.length > 0 && etaList[0].dest_tc) {
                destName = etaList[0].dest_tc;
            }

            let html = `
                <div class="direction-section">
                    <div class="direction-title">${routeNum} 號線 ➡️ 往 ${destName} (${dirLabel})</div>
                    <ul class="stop-list">
            `;

            // 依序抓出路線中的所有巴士站
            for (const item of routeStops) {
                const stopId = item.stop;
                const stopName = await getStopName(stopId);

                // 篩選出這個巴士站的 ETA 紀錄（按時間排序）
                const stopEtas = etaList
                    .filter(e => e.stop === stopId && e.eta)
                    .sort((a, b) => new Date(a.eta) - new Date(b.eta));

                let etaDisplay = `<span class="no-bus">暫無班次</span>`;
                let nextBusDisplay = '';

                if (stopEtas.length > 0) {
                    const firstBusMins = calculateRemainingMinutes(stopEtas[0].eta);
                    if (firstBusMins) {
                        etaDisplay = `<span class="eta-box">${firstBusMins}</span>`;
                    }
                    // 如果有下一班車，順便列出
                    if (stopEtas.length > 1) {
                        const secondBusMins = calculateRemainingMinutes(stopEtas[1].eta);
                        if (secondBusMins) {
                            nextBusDisplay = `<span class="eta-next">下班: ${secondBusMins}</span>`;
                        }
                    }
                }

                html += `
                    <li class="stop-item">
                        <div class="stop-name">${item.seq}. ${stopName}</div>
                        <div class="eta-container">
                            ${etaDisplay}
                            ${nextBusDisplay}
                        </div>
                    </li>
                `;
            }

            html += `</ul></div>`;
            return html;
        }
    </script>
</body>
</html>
